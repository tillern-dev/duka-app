name: duka_app
description: DukaBook 2.2 offline-first retail pilot beta, instalment debts and stock audit.
publish_to: 'none'
version: 2.2.0+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  url_launcher: ^6.3.0
  file_picker: 8.1.7
  share_plus: 7.2.2
  cross_file: ^0.3.4+2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/branding/storefront_icon.png
    - assets/branding/dukabook_logo.png
