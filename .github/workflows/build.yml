name: Build DukaBook v2.2 Retail Pilot Beta APK

on:
  push:
    branches: [main, feature/v2-2-retail-pilot]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true
      - name: Create Android project without replacing app source
        run: |
          cp lib/main.dart /tmp/dukabook-main.dart
          cp pubspec.yaml /tmp/dukabook-pubspec.yaml
          flutter create . --org com.eldoret.dukabook --project-name duka_app --platforms android
          cp /tmp/dukabook-main.dart lib/main.dart
          cp /tmp/dukabook-pubspec.yaml pubspec.yaml
      - name: Apply DukaBook beta app name, icon, and splash art
        run: python3 scripts/apply_android_branding.py
      - name: Get packages
        run: flutter pub get
      - name: Analyze Dart source
        run: flutter analyze --no-fatal-infos lib/main.dart
      - name: Build beta APK
        run: flutter build apk --release
      - name: Upload beta APK
        uses: actions/upload-artifact@v4
        with:
          name: DukaBook-v2.2-Retail-Pilot-Beta-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
