name: Build DukaBook Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      # The repository originally had no Android/gradle scaffold. Create one
      # but restore the real app entry point afterwards, never a demo screen.
      - name: Create missing Flutter Android project files
        run: |
          cp lib/main.dart /tmp/dukabook-main.dart
          cp pubspec.yaml /tmp/dukabook-pubspec.yaml
          flutter create . --org com.eldoret.dukabook --project-name duka_app --platforms android
          cp /tmp/dukabook-main.dart lib/main.dart
          cp /tmp/dukabook-pubspec.yaml pubspec.yaml

      - name: Get packages
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: DukaBook-v2-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
